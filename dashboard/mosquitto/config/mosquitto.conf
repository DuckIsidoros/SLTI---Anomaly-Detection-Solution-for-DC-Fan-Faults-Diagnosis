# ==============================================================================
# Eclipse Mosquitto 2.x Configuration
# ==============================================================================

# Persistence & Storage
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Authentication & Access Control
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# ------------------------------------------------------------------------------
# Listener 1: Native MQTTS over TCP (Port 8883) for MQTTX & ESP32 Edge Gateway
# ------------------------------------------------------------------------------
listener 8883 0.0.0.0
protocol mqtt

# Certificates (Mounted into the Docker container)
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# TLS Settings
# Supports TLS 1.2 and 1.3 (required for broad client compatibility)
tls_version tlsv1.2
require_certificate false

# ------------------------------------------------------------------------------
# Listener 2: Secure WebSockets (Port 8084) for Web Dashboards & Frontend
# ------------------------------------------------------------------------------
listener 8084 0.0.0.0
protocol websockets

cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# WebSockets TLS Settings
tls_version tlsv1.2
require_certificate false