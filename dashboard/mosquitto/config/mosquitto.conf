# ==============================================================================
# Eclipse Mosquitto 2.x Docker Configuration
# ==============================================================================

# Persistence & Storage
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Authentication & Access Control (IEC 62443 Zero-Trust)
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# ------------------------------------------------------------------------------
# Listener 1: Native MQTTS over TCP (Port 8883) for Edge Gateways & Backend
# ------------------------------------------------------------------------------
listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.3

# ------------------------------------------------------------------------------
# Listener 2: Secure WebSockets (Port 8084) for Web Dashboards & Frontend Apps
# ------------------------------------------------------------------------------
listener 8084 0.0.0.0
protocol websockets
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.3
